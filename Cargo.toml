[workspace]
resolver = "2"
members = ["crates/watch-types", "crates/watch-core", "crates/watch-server"]
# `ui` is a Leptos CSR app built for wasm32 by trunk; it has its own lockfile and is not part of the native workspace.
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aon-co-jp/open-upstream-watch"
authors = ["石 塚 正 浩（MASAHIRO ISHIZUKA）"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
