[package]
name = "watch-server"
description = "HTTP server + scheduler for open-upstream-watch: JSON status API, e-mail one-time-password login, and the Leptos dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "watch-server"
path = "src/main.rs"

[dependencies]
watch-core = { path = "../watch-core" }
watch-types = { path = "../watch-types" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
poem = { version = "3", features = ["static-files", "cookie", "test"] }
rand = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
